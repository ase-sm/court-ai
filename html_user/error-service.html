

<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="format-detection" content="telephone=no">
<title>대한민국 법원 재판지원 AI</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/user-style.css">
<script src="../js/jquery-3.7.1.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/pub-user-ui.js"></script>
</head>
<body>
  <div class="wrap">
    <script> $(document).ready(function() { $.get('header.html', function(data) { $('.wrap').prepend(data);}); }); </script>        
      <span id="content" tabindex="-1" class="skip-anchor">본문시작</span>
      <div class="container-wrap">
        <script> $(document).ready(function() { $.get('sidebar.html', function(data) { $('.container-wrap').prepend(data);}); }); </script>        
        <div class="container">
          <div class="contents error-contents">
            <main class="content" aria-labelledby="content">
              
              <div class="error-wrap">
                <i class="ico-error-service"></i>
                <div class="error-text">
                  <strong>서비스 중단 안내</strong>
                  <p>서비스 점검 작업으로 인해 서비스가 중단되오니 너그러운 양해를 부탁드립니다.</p>
                  <div class="error-txt-box">
                    <b>점검기간 </b>
                    <span>2026-00-00 00:00 ~ yyyy-mm-dd hh:mm</span>
                  </div>
                  <div class="btn-wrap">
                    <button type="button" class="btn-lg st-blue-line">이전 페이지</button>
                    <button type="button" class="btn-lg st-blue">홈으로 이동</button>
                  </div>
                </div>
              </div>
            </main>
          </div>
          <!-- // contents -->
        </div>
        <!-- // container -->
      </div>
      <!-- // container-wrap -->
  </div>
  <!-- // wrap -->
</body>
</html>
